name: SRTP TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4 with FFI
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: ffi
          ini-values: ffi.enable=true
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install OpenSSL 3.x and libsrtp2
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo add-apt-repository -y ppa:ondrej/nginx
          sudo apt update
          sudo apt install -y libssl-dev openssl libsrtp2-dev
          openssl version -v
          pkg-config --modversion libsrtp2 || echo "libsrtp2 not found"

      - name: Check PHP and FFI status
        run: |
          php -v
          php -r "echo 'FFI enabled: ' . (extension_loaded('ffi') ? 'yes' : 'no') . PHP_EOL;"

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
